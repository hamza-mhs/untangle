<style>
body{margin:0;background:#000000}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
.bg-btn{transition:transform .16s cubic-bezier(.23,1,.32,1)}
.bg-btn:active{transform:scale(.97)}
.bg-btn:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}

.tick{display:inline-block;height:1em;line-height:1em;overflow:hidden;vertical-align:-0.12em}
.tick>span{display:block;animation:tick 60s steps(60) infinite}
.tick>span>span{display:block;height:1em;line-height:1em}
@keyframes tick{to{transform:translateY(-60em)}}
.star{animation:twinkle var(--d,5s) ease-in-out var(--o,0s) infinite alternate}
.stars{animation:drift 48s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.06}to{opacity:var(--a,.5)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-14px,6px)}}
@property --n{syntax:'<integer>';initial-value:58;inherits:false}
.count{counter-reset:n var(--n);animation:cnt 7s cubic-bezier(.45,0,.2,1) infinite}
.count::after{content:counter(n)}
@keyframes cnt{0%,8%{--n:58}42%,86%{--n:72}100%{--n:58}}
.ring{animation:ring 7s cubic-bezier(.45,0,.2,1) infinite}
@keyframes ring{0%,8%{stroke-dashoffset:var(--from)}42%,86%{stroke-dashoffset:var(--to)}100%{stroke-dashoffset:var(--from)}}
.w{color:var(--g,#3A3A3A);animation:word .5s ease-out both;animation-delay:var(--t)}
@keyframes word{0%{color:var(--g,#3A3A3A)}45%{color:var(--hi,#FF7B2F)}100%{color:#FFFFFF}}
.wave{display:flex;align-items:center;gap:4px;height:36px}
.wave>span{display:block;width:4px;height:100%;border-radius:2px;background:currentColor;animation:wave .9s ease-in-out infinite alternate;animation-delay:var(--t)}
@keyframes wave{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){.star,.stars,.count,.ring,.wave>span,.tick>span{animation:none}.w{animation-duration:0s}}

</style>
