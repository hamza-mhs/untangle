plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// TODO(owner): rename with the real application id (app.config.ts PACKAGE_ID).
group = 'com.todo.untangle.blocker'
version = '1.0.0'

android {
  namespace "com.todo.untangle.blocker"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  testImplementation 'junit:junit:4.13.2'
}
