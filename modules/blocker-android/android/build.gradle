// Compose compiler plugin is required by Jetpack Glance (home-screen widgets).
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// TODO(verify): rename with the real application id (see app.config.ts BASE_ID).
group = 'com.todo.untangle.blocker'
version = '0.1.0'

android {
  namespace "com.todo.untangle.blocker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.glance:glance-appwidget:1.2.0'
}
